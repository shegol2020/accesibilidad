<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Partners</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 20px; }

        /* Skip Link Styles */
        .skip-link { position: absolute; top: -100px; left: 0; background: #333; color: white; padding: 10px; z-index: 100; text-decoration: none; }
        .skip-link:focus { top: 0; }

        header { border-bottom: 1px solid #ccc; padding: 10px 0; margin-bottom: 20px; }

        /* Logo in header */
        .logo-link img { width: 150px; height: auto; }

        /* Partners container */
        .partners-grid { display: flex; gap: 40px; align-items: center; margin-top: 20px; }

        /* Second partner (background image) */
        .partner-bg {
            width: 100px;
            height: 100px;
            background-image: url('../ejemplos/img/partner-2.avif');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: 1px solid #eee;
        }

        .partner-img { width: 100px; height: auto; }
        svg { width: 100px; height: auto; }

        footer { margin-top: 50px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

    <header>
        <!-- Link without name + image without alt attribute -->
        <a href="index.html" class="logo-link">
            <img src="../ejemplos/img/logo-principal.jpg">
        </a>
    </header>

    <main id="main-content">
        <h1>Our Partners</h1>

        <div class="partners-grid">
            <!-- empty alt attribute -->
            <img src="../ejemplos/img/partner-1.png" alt="" class="partner-img">

            <!-- background image -->
            <div class="partner-bg"></div>

            <!-- svg image without title -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="40" fill="navy" />
                <rect x="30" y="30" width="40" height="40" fill="white" />
            </svg>
        </div>
    </main>

</body>
</html>
