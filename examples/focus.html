<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Demo: Focus States</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      color: #1a1a1a;
    }

    h1 { font-size: 24px; font-weight: 500; margin-bottom: 8px; }

    .intro {
      font-size: 14px;
      color: #333;
      margin-bottom: 2rem;
    }

    .demo-section { margin-bottom: 2.5rem; }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 8px;
    }

    .card {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* 1. No focus */
    .btn-no-focus {
      padding: 9px 20px;
      font-size: 14px;
      font-family: sans-serif;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
    }
    .btn-no-focus:focus {
      outline: none;
    }

    /* 2. System focus — browser default */
    .btn-system {
      padding: 9px 20px;
      font-size: 14px;
      font-family: sans-serif;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
    }

    /* 3. Custom outline */
    .btn-custom {
      padding: 9px 20px;
      font-size: 14px;
      font-family: sans-serif;
      border-radius: 6px;
      border: 1px solid #4a6fa5;
      background: #4a6fa5;
      color: #fff;
      cursor: pointer;
      outline: none;
    }
    .btn-custom:focus-visible {
      outline: 3px solid #f0a500;
      outline-offset: 3px;
    }

    /* 4. Color change — subtle */
    .btn-color {
      padding: 9px 20px;
      font-size: 14px;
      font-family: sans-serif;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #e8e8e8;
      color: #555;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }
    .btn-color:focus-visible {
      background: #dcdcdc;
      outline: none;
    }

    /* skip link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 10px;
      background: #000;
      color: #fff;
      padding: 10px;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content">

    <h1>Accessibility Demo: Focus States</h1>
    <p class="intro">Tab through the buttons to see different focus behaviours</p>

    <!-- 1. No focus -->
    <div class="demo-section">
      <p class="section-label">1. No focus indicator</p>
      <div class="card">
        <button class="btn-no-focus">Submit</button>
        <button class="btn-no-focus">Cancel</button>
        <button class="btn-no-focus">Save draft</button>
      </div>
    </div>

    <!-- 2. System focus -->
    <div class="demo-section">
      <p class="section-label">2. System / browser default focus</p>
      <div class="card">
        <button class="btn-system">Next step</button>
        <button class="btn-system">Go back</button>
        <button class="btn-system">Learn more</button>
      </div>
    </div>

    <!-- 3. Custom outline -->
    <div class="demo-section">
      <p class="section-label">3. Custom focus — visible outline</p>
      <div class="card">
        <button class="btn-custom">Confirm order</button>
        <button class="btn-custom">Add to cart</button>
        <button class="btn-custom">Subscribe</button>
      </div>
    </div>

    <!-- 4. Color change -->
    <div class="demo-section">
      <p class="section-label">4. Focus via colour change — subtle</p>
      <div class="card">
        <button class="btn-color">Download</button>
        <button class="btn-color">Share</button>
        <button class="btn-color">Edit</button>
      </div>
    </div>

  </main>

</body>
</html>
