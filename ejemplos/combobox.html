<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Issues Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .field-wrapper {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 4px;
    }

    input {
      padding: 8px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    ul[role="listbox"] {
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #ccc;
      width: 300px;
    }

    ul[role="listbox"] li {
      padding: 8px;
      cursor: pointer;
    }

    ul[role="listbox"] li:hover {
      background-color: #f0f0f0;
    }

    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Accessibility Issues Example</h1>

  <h2>Version with Issues</h2>

  <form>
    <div class="field-wrapper">
      <label
        id="mat-mdc-form-field-label-0"
        for="mat-input-0">Test 1
      </label>

      <!-- ISSUE: role="combobox" is missing aria-controls and aria-activedescendant -->
      <input
        type="text"
        id="mat-input-0"
        name="customerId"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="true"
        aria-haspopup="listbox"
      />
      <ul role="listbox" id="customer-listbox-bad" aria-label="Customers list">
  <li role="option" id="bad-option-1">Customer 1</li>
  <li role="option" id="bad-option-2">Customer 2</li>
  <li role="option" id="bad-option-3">Customer 3</li>
</ul>

    </div>
  </form>

  <hr>

  <h2>Fixed Version</h2>

  <form>
    <div class="field-wrapper">

      <!-- FIX 1: label has a visible text -->
      <label for="customer-input">
        Customer ID
      </label>

      <input
        type="text"
        id="customer-input"
        name="customerId"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-haspopup="listbox"
        aria-controls="customer-listbox"
        aria-activedescendant=""
        autocomplete="on"
        aria-describedby="customer-error"
      />

      <!-- Listbox for dropdown options -->
      <ul
        id="customer-listbox"
        role="listbox"
        aria-label="Customer options"
        hidden>
        <li role="option" id="option-1">Customer 1</li>
        <li role="option" id="option-2">Customer 2</li>
      </ul>

      <!-- Error message container -->
      <span
        id="customer-error"
        role="alert"
        aria-live="polite"
        class="error"
        style="display: none;">
        Please select a customer
      </span>

    </div>
  </form>

</body>
</html>
