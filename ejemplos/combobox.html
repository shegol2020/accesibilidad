<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Issues Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .field-wrapper {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 4px;
    }

    input {
      padding: 8px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    ul[role="listbox"] {
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #ccc;
      width: 300px;
    }

    ul[role="listbox"] li {
      padding: 8px;
      cursor: pointer;
    }

    ul[role="listbox"] li:hover {
      background-color: #f0f0f0;
    }

    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

  <h2>Version with Issues</h2>
